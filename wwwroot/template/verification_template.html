<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
    <div style='font-family: -apple-system, BlinkMacSystemFont, ""Segoe UI"", Roboto, ""Helvetica Neue"", Arial, sans-serif; background-color: #f8fafc; padding: 40px 0; color: #334155;'>
        <div style='max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);'>

            <!-- 顶部品牌 Banner -->
            <div style='background-color: #2563eb; padding: 28px 24px; text-align: center; color: #ffffff;'>
                <h1 style='margin: 0; font-size: 22px; font-weight: 700; letter-spacing: 0.5px;'>SiteDeploy</h1>
                <p style='margin: 6px 0 0 0; font-size: 13px; opacity: 0.9;'>安全验证中心</p>
            </div>

            <!-- 主体内容区域 -->
            <div style='padding: 32px 24px;'>
                <p style='font-size: 16px; margin-top: 0;'>你好：</p>

                <p style='font-size: 14.5px; line-height: 1.6; color: #475569;'>
                    您正在进行 SiteDeploy 账户安全验证。请在验证页面输入下方的 6 位验证码以完成操作：
                </p>

                <!-- 验证码高亮展示大卡片 -->
                <div style='background-color: #f1f5f9; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 24px; text-align: center; margin: 28px 0;'>
                    <span style='font-size: 32px; font-weight: 700; letter-spacing: 6px; color: #2563eb;'>{code}</span>
                </div>

                <!-- 提示信息区块 -->
                <div style='background-color: #fffbeb; border: 1px solid #fef3c7; border-radius: 6px; padding: 14px 16px; margin-bottom: 24px;'>
                    <p style='margin: 0; font-size: 13px; color: #b45309; line-height: 1.5;'>
                        ⏰ <strong>安全提示</strong>：此验证码将在 <strong>10 分钟</strong>内失效。为了保障您的账户安全，请勿将验证码泄露给任何人。
                    </p>
                </div>

                <p style='font-size: 13.5px; color: #94a3b8; line-height: 1.5;'>
                    如果这不是您的本人操作，请忽略此邮件，您的账户将保持安全。
                </p>
            </div>

            <!-- 底部版权 -->
            <div style='background-color: #f8fafc; padding: 16px 24px; text-align: center; font-size: 12px; color: #94a3b8; border-top: 1px solid #e2e8f0;'>
                <p style='margin: 0;'>&copy; SiteDeploy. All rights reserved.</p>
                <p style='margin: 4px 0 0 0;'>这是一封系统自动发送的邮件，请勿直接回复。</p>
            </div>

        </div>
    </div>
</body>
</html>
